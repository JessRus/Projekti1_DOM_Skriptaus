<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do lista harjoitus</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="todo-lista">
        <h2>To-Do Lista</h2>
        <div class="row">
            <input type="text" id="inputBox" placeholder="Lisää to-do tehtävä">
            <button class="addButton" onclick="addTask()">Lisää</button>
        </div>
        <ul id="listContainer">
        </ul>
    </div>
</div>

</body>
</html>
